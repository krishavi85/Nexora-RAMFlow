name: Windows Build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Nexora.RAMFlow.sln

      - name: Build
        run: dotnet build Nexora.RAMFlow.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Nexora.RAMFlow.Core.Tests/Nexora.RAMFlow.Core.Tests.csproj --configuration Release --no-build

      - name: Publish Windows x64
        run: dotnet publish src/Nexora.RAMFlow.App/Nexora.RAMFlow.App.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true --output artifacts/win-x64

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-RAMFlow-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
